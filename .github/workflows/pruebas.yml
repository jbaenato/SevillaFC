name: Pruebas automáticas

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobar:
    name: Sintaxis, unitarias y navegador
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar sintaxis
        run: npm run check

      - name: Ejecutar pruebas unitarias
        run: npm test

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas de navegador
        run: npm run test:browser

      - name: Guardar diagnóstico si falla
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: diagnostico-pruebas
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
